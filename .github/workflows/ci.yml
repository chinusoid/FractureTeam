name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, AI eval (mock), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:ai
      - run: npm run build

  e2e:
    name: Browser walkthrough (390px and desktop)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # No OPENAI_API_KEY and no AI_MOCK: the walkthrough first checks the "assistant unavailable" state,
      # then mocks /api/assistant inside the browser test.
      - name: Start server and run walkthrough
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            app/tests/e2e/screenshots
            app/server.log
          if-no-files-found: ignore

  assistant-e2e:
    name: Assistant path in the browser (mock model)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # UI -> adapter -> /api/assistant -> tool loop -> guards, with the deterministic mock model.
      # The mock is refused in production, so this runs on the dev server.
      - name: Start dev server with the mock model and run walkthrough
        env:
          AI_MOCK: "1"
          QUOTA_MODE: memory
        run: |
          npm run dev -- --port 3000 > dev.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 90000
          curl -s http://localhost:3000/ > /dev/null
          npm run e2e:assistant
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-e2e
          path: |
            app/tests/e2e/screenshots
            app/dev.log
          if-no-files-found: ignore
